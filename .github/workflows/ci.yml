name: "SSO Platform CI/CD Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    name: Build, Lint, Test & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      APP_URL: "https://sso-ci.example.com"
      OIDC_ISSUER: "https://tenant-ci.auth0.com/"
      OIDC_CLIENT_ID: "ci-client-id"
      OIDC_CLIENT_SECRET: ${{ secrets.CI_OIDC_CLIENT_SECRET }}
      OIDC_CALLBACK_URL: "https://sso-ci.example.com/auth/callback"
      OIDC_ERROR_URL: "https://sso-ci.example.com/auth/error"
      OIDC_LOGOUT_CALLBACK_URL: "https://sso-ci.example.com/auth/logout"
      SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}
      GITHUB_WEBHOOK_SECRET: ${{ secrets.CI_GITHUB_WEBHOOK_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Checks
        run: npm run lint

      - name: Run Security Dependency Audit
        run: npm audit --audit-level=high

      - name: Run Unit and Security Tests
        run: npm test

      - name: Build Application
        run: npm run build
